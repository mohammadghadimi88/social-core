<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Social Core — یک شبکه اجتماعی مینیمال و سریع"><title>Social Core</title><link rel="stylesheet" href="style.css"></head><body><header><strong>Social Core</strong><button id="theme" aria-label="تغییر پوسته">◐</button></header><main><section id="auth"><h1>خوش آمدی</h1><p class="muted">یک شبکه اجتماعی ساده، خلوت و سریع.</p><form id="authForm"><input id="email" type="email" placeholder="ایمیل" autocomplete="email" required><input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required minlength="6"><input id="username" placeholder="نام کاربری" autocomplete="username" minlength="3" maxlength="24" hidden><button id="authSubmit">ورود</button></form><button id="authMode" type="button">ساخت حساب جدید</button><p><small id="authMsg"></small></p></section><section id="app" hidden><nav><button data-view="feed">خانه</button><button data-view="explore">کاوش</button><button data-view="profile">پروفایل</button><button data-view="notifications">اعلان‌ها</button><button id="logout">خروج</button></nav><div id="view"></div></section></main><script type="module" src="app.js"></script></body></html>
